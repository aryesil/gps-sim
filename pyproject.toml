[project]
name = "gps-sim"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "python-multipart",
    "uvicorn>=0.29",
    "websockets>=12",
    "numpy>=1.26",
    "requests>=2.31",
    "georinex>=1.16",
    "python-dateutil>=2.9",
    "pyadi-iio>=0.0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
