<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS L1 C/A Signal Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="rf-status-bar" class="rf-off">RF OUTPUT: OFF</div>
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>Confirm RF Transmission</h3>
    <p>This will transmit real RF. Confirm you are in a shielded/isolated test
    environment by typing <strong>TRANSMIT</strong> below.</p>
    <input id="confirm-modal-input" placeholder="Type TRANSMIT" autocomplete="off">
    <div class="modal-actions">
      <button id="confirm-modal-cancel" class="btn-secondary">Cancel</button>
      <button id="confirm-modal-ok" class="btn-danger" disabled>Confirm &amp; Transmit</button>
    </div>
  </div>
</div>
<div id="app-shell">
  <nav id="sidebar">
    <button class="side-icon active" data-page="channels" title="Channels">CH</button>
    <button class="side-icon" data-page="trajectory" title="Trajectory Builder">TB</button>
    <button class="side-icon" data-page="log" title="Log">LG</button>
  </nav>
  <main id="page-container">
    <section data-page="channels" id="page-channels">
      <p class="warn">Cabled / shielded setup only. Low TX gain + in-line attenuation.</p>
      <div id="channel-list"></div>
      <button id="btn-add-channel">Add Channel</button>
      <button id="btn-start-all">Start All</button>
    </section>
    <section data-page="trajectory" id="page-trajectory" hidden>
      <div id="trajectory-toolbar">
        <button id="tb-new">New</button>
        <button id="tb-save">Save as...</button>
        <button id="tb-open">Open</button>
        <select id="tb-open-list"></select>
        <button id="tb-apply">Apply to channel</button>
      </div>
      <div id="trajectory-map" style="height:420px"></div>
      <table id="trajectory-table"></table>
    </section>
    <section data-page="log" id="page-log" hidden>
      <ul id="log-list"></ul>
    </section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/pages.js"></script>
<script src="/static/map.js"></script>
<script src="/static/skyplot.js"></script>
<script src="/static/plots.js"></script>
<script src="/static/iqplot.js"></script>
<script src="/static/channels.js"></script>
<script src="/static/live.js"></script>
<script src="/static/trajectory.js"></script>
<script src="/static/log.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
