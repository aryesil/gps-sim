<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS L1 C/A Signal Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css?v=13">
</head>
<body>
<div id="rf-status-bar" class="rf-off">RF OUTPUT: OFF<button id="btn-api-key" title="Set operator API key (RBAC)">🔑</button></div>
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>Confirm RF Transmission</h3>
    <p>This will transmit real RF. Confirm you are in a shielded/isolated test
    environment by typing <strong>TRANSMIT</strong> below.</p>
    <input id="confirm-modal-input" placeholder="Type TRANSMIT" autocomplete="off">
    <div class="modal-actions">
      <button id="confirm-modal-cancel" class="btn-secondary">Cancel</button>
      <button id="confirm-modal-ok" class="btn-danger" disabled>Confirm &amp; Transmit</button>
    </div>
  </div>
</div>
<div id="app-shell">
  <nav id="sidebar">
    <button class="side-icon active" data-page="channels" title="Channels">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>
      <span>Channels</span>
    </button>
    <button class="side-icon" data-page="trajectory" title="Trajectory Builder">
      <svg viewBox="0 0 24 24"><path d="M12 2c-4 0-7 3-7 7 0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"></path><circle cx="12" cy="9" r="2.4" fill="var(--bg)" stroke="none"></circle></svg>
      <span>Trajectory Builder</span>
    </button>
    <button class="side-icon" data-page="log" title="Log">
      <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
      <span>Log</span>
    </button>
  </nav>
  <main id="page-container">
    <section data-page="channels" id="page-channels">
      <p class="warn">Cabled / shielded setup only. Low TX gain + in-line attenuation.</p>
      <div id="channel-list"></div>
      <button id="btn-add-channel">Add Channel</button>
      <button id="btn-start-all">Start All</button>
    </section>
    <section data-page="trajectory" id="page-trajectory" hidden>
      <div id="trajectory-toolbar">
        <button id="tb-new">New</button>
        <button id="tb-save">Save as...</button>
        <button id="tb-open">Open</button>
        <select id="tb-open-list"></select>
        <button id="tb-apply">Apply to channel</button>
      </div>
      <div id="trajectory-map" style="height:420px"></div>
      <table id="trajectory-table"></table>
    </section>
    <section data-page="log" id="page-log" hidden>
      <div id="receiver-feed-panel">
        <h4>Real Receiver Feedback</h4>
        <div class="scenario-lib-row">
          <select id="rf-listen-mode">
            <option value="udp">UDP</option>
            <option value="serial">Serial</option>
          </select>
          <input id="rf-listen-addr" placeholder="host:port or /dev/ttyUSB0:9600" size="24" value="0.0.0.0:29500">
          <button id="rf-listen-start">Start listening</button>
          <button id="rf-listen-stop">Stop</button>
        </div>
        <div id="rf-fix-readout" class="hint">not listening</div>
      </div>
      <ul id="log-list"></ul>
    </section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/pages.js?v=13"></script>
<script src="/static/map.js?v=13"></script>
<script src="/static/skyplot.js?v=13"></script>
<script src="/static/plots.js?v=13"></script>
<script src="/static/iqplot.js?v=13"></script>
<script src="/static/channels.js?v=13"></script>
<script src="/static/live.js?v=13"></script>
<script src="/static/trajectory.js?v=13"></script>
<script src="/static/log.js?v=13"></script>
<script src="/static/app.js?v=13"></script>
</body>
</html>
